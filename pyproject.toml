[project]
name = "nl2sql-agent"
version = "0.1.0"
description = "Agentic natural-language to SQL assistant with hybrid schema retrieval and measured evaluation"
readme = "README.md"
requires-python = ">=3.11"


dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.11",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlglot>=30.18.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
nl2sql = "nl2sql_agent.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nl2sql_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

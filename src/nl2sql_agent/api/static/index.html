<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>NL→SQL Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e8ec; --dim:#8b93a7; --accent:#7aa2f7; --err:#f7768e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.55 ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:900px; margin:0 auto; padding:48px 24px 80px; }
  h1 { font-size:22px; font-weight:600; margin:0 0 4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:32px; }
  textarea { width:100%; min-height:84px; padding:12px 14px; resize:vertical;
             background:var(--panel); color:var(--text); border:1px solid var(--line);
             border-radius:8px; font:inherit; }
  textarea:focus { outline:none; border-color:var(--accent); }
  .row { display:flex; gap:10px; align-items:center; margin-top:12px; }
  button { padding:9px 18px; background:var(--accent); color:#0f1115; border:none;
           border-radius:7px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { color:var(--dim); font-size:13px; }
  section { margin-top:28px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); font-weight:600; margin:0 0 8px; }
  pre { margin:0; padding:14px; background:var(--panel); border:1px solid var(--line);
        border-radius:8px; overflow-x:auto; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; }
  pre.error { border-color:var(--err); color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:13px;
          background:var(--panel); border:1px solid var(--line); border-radius:8px; }
  td { padding:8px 12px; border-bottom:1px solid var(--line);
       font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  tr:last-child td { border-bottom:none; }
  .meta { color:var(--dim); font-size:12px; margin-top:20px;
          font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .samples { margin-top:14px; display:flex; flex-wrap:wrap; gap:6px; }
  .samples button { background:transparent; border:1px solid var(--line);
                    color:var(--dim); font-weight:400; font-size:12px; padding:5px 10px; }
  .samples button:hover { border-color:var(--accent); color:var(--text); }
  .hidden { display:none; }
</style>
</head>
<body>
<main>
  <h1>NL→SQL Agent</h1>
  <div class="sub">Version naïve — schéma complet dans le prompt, sans recherche ni validation.</div>

  <textarea id="q" placeholder="Pose une question en anglais…"></textarea>

  <div class="samples">
    <button data-q="How much did customer 6 consume in total between August and November 2013?">consommation client 6</button>
    <button data-q="How many more discount gas stations does the Czech Republic have compared to Slovakia?">stations CZE vs SVK</button>
    <button data-q="What is the total cost of the pizzas for all the events?">coût des pizzas</button>
    <button data-q="How many female patients were given an APS diagnosis?">patientes APS</button>
  </div>

  <div class="row">
    <button id="go">Générer</button>
    <span class="hint" id="status"></span>
  </div>

  <section id="out" class="hidden">
    <h2>Requête générée</h2>
    <pre id="sql"></pre>

    <div id="resultBlock" class="hidden" style="margin-top:20px">
      <h2>Résultat</h2>
      <div id="rows"></div>
    </div>

    <div id="errorBlock" class="hidden" style="margin-top:20px">
      <h2>Erreur</h2>
      <pre id="err" class="error"></pre>
    </div>

    <div class="meta" id="meta"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

document.querySelectorAll('.samples button').forEach(b => {
  b.onclick = () => { $('q').value = b.dataset.q; run(); };
});

$('go').onclick = run;
$('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) run();
});

async function run() {
  const question = $('q').value.trim();
  if (!question) return;

  $('go').disabled = true;
  $('status').textContent = 'génération…';
  $('out').classList.add('hidden');

  try {
    const res = await fetch('/query', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({question})
    });
    const d = await res.json();

    $('sql').textContent = d.sql;
    $('out').classList.remove('hidden');

    if (d.error) {
      $('errorBlock').classList.remove('hidden');
      $('resultBlock').classList.add('hidden');
      $('err').textContent = d.error;
    } else {
      $('errorBlock').classList.add('hidden');
      $('resultBlock').classList.remove('hidden');
      $('rows').innerHTML = renderRows(d.rows);
    }

    $('meta').textContent =
      `${d.prompt_tokens} tokens entrée · ${d.completion_tokens} sortie · ` +
      `${d.latency_s}s · ${d.model}`;
  } catch (e) {
    $('out').classList.remove('hidden');
    $('sql').textContent = '';
    $('errorBlock').classList.remove('hidden');
    $('err').textContent = String(e);
  } finally {
    $('go').disabled = false;
    $('status').textContent = '';
  }
}

function renderRows(rows) {
  if (!rows || !rows.length) return '<pre>aucune ligne</pre>';
  const body = rows.slice(0, 50).map(r =>
    '<tr>' + r.map(c => `<td>${c === null ? 'NULL' : escapeHtml(String(c))}</td>`).join('') + '</tr>'
  ).join('');
  const more = rows.length > 50 ? `<div class="meta">${rows.length - 50} lignes de plus</div>` : '';
  return `<table>${body}</table>${more}`;
}

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
